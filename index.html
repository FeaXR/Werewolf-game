<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <title>Werewolf</title>
  </head>
  <body>
    <h1>Werewolf</h1>

    <form id="charForm">
      <div class="grid-container" id="playerGrid">
        <!-- Headers and rows dynamically generated -->
      </div>

      <div class="controls">
        <button type="button" id="addPlayerBtn">Add Player</button>
        <button type="button" id="clearBtn">Clear</button>
        <button type="submit" id="saveBtn">Save</button>
      </div>
    </form>

    <!-- ROLE MANAGER -->
    <div class="collapsible manager" id="roleManager">
      <div class="collapsible-header">Manage Roles</div>
      <div class="collapsible-content">
        <input type="text" id="newRoleInput" placeholder="New role name" />
        <button type="button" id="addRoleBtn">Add Role</button>

        <h3>Existing Roles</h3>
        <div id="roleList"></div>
      </div>
    </div>

    <!-- STATUS EFFECT MANAGER -->
    <div class="collapsible manager" id="statusManager">
      <div class="collapsible-header">Manage Status Effects</div>
      <div class="collapsible-content">
        <input
          type="text"
          id="newStatusInput"
          placeholder="New status effect"
        />
        <button type="button" id="addStatusBtn">Add Effect</button>

        <h3>Existing Effects</h3>
        <div id="statusList"></div>
      </div>
    </div>

    <script>
      /* ------------------------------
     CENTRAL DATA
  ------------------------------ */
      let ROLE_OPTIONS = [
        "Werewolf",
        "Villager",
        "Seer",
        "Bodyguard",
        "Chupakabra",
        "Vacuum salesman",
      ];
      let STATUS_EFFECTS = ["Has Vacuum"];

      const grid = document.getElementById("playerGrid");
      const addBtn = document.getElementById("addPlayerBtn");
      const clearBtn = document.getElementById("clearBtn");
      const form = document.getElementById("charForm");

      const roleListDiv = document.getElementById("roleList");
      const newRoleInput = document.getElementById("newRoleInput");
      const addRoleBtn = document.getElementById("addRoleBtn");

      const statusListDiv = document.getElementById("statusList");
      const newStatusInput = document.getElementById("newStatusInput");
      const addStatusBtn = document.getElementById("addStatusBtn");

      let playerCount = 0;

      /* ------------------------------
     COLLAPSIBLE LOGIC
  ------------------------------ */
      document.querySelectorAll(".collapsible-header").forEach((header) => {
        header.addEventListener("click", () => {
          header.parentElement.classList.toggle("open");
        });
      });

      /* ------------------------------
     DATA CAPTURE & RESTORE
  ------------------------------ */
      function capturePlayerData() {
        const data = [];

        for (let i = 1; i <= playerCount; i++) {
          const row = {};

          row.name = form.querySelector(`input[name="name${i}"]`)?.value || "";
          row.role = form.querySelector(`select[name="role${i}"]`)?.value || "";
          row.isDead =
            form.querySelector(`input[name="isDead${i}"]`)?.checked || false;

          row.effects = {};
          STATUS_EFFECTS.forEach((effect) => {
            const key = `status_${effect
              .replace(/\s+/g, "_")
              .toLowerCase()}_${i}`;
            row.effects[key] =
              form.querySelector(`input[name="${key}"]`)?.checked || false;
          });

          data.push(row);
        }
        return data;
      }

      function restorePlayerData(data) {
        data.forEach((row, index) => {
          const id = index + 1;

          // addPlayer();
          const nameInput = form.querySelector(`input[name="name${id}"]`);
          const roleSelect = form.querySelector(`select[name="role${id}"]`);
          const isDead = form.querySelector(`input[name="isDead${id}"]`);

          if (nameInput) nameInput.value = row.name;
          if (roleSelect) roleSelect.value = row.role;
          if (isDead) isDead.checked = row.isDead;

          STATUS_EFFECTS.forEach((effect) => {
            const key = `status_${effect
              .replace(/\s+/g, "_")
              .toLowerCase()}_${id}`;
            const cb = form.querySelector(`input[name="${key}"]`);
            if (cb) cb.checked = row.effects[key];
          });
        });
      }

      function restoreRoles(data) {
        ROLE_OPTIONS = data;
        renderRoleList();
        rebuildHeaders();
      }

      function restoreStatuses(data) {
        STATUS_EFFECTS = data;
        renderStatusList();
        rebuildHeaders();
      }

      function restoreFromURL() {
        let params = new URLSearchParams(document.location.search);

        var roleData = params.get("roleData");
        if (roleData) restoreRoles(JSON.parse(roleData));

        var statusData = params.get("statusData");
        if (statusData) restoreStatuses(JSON.parse(statusData));

        var playerData = params.get("playerData");

        if (playerData) {
          playerData = JSON.parse(playerData);

          for (let i = 0; i < playerData.length - 1; i++) {
            addPlayer();
          }

          restorePlayerData(playerData);
        }
      }

      /* ------------------------------
     GRID HEADER REBUILD
  ------------------------------ */
      function rebuildHeaders() {
        const saved = capturePlayerData();

        grid.innerHTML = "";

        const headers = ["Name", "Role", "Dead", ...STATUS_EFFECTS, "Remove"];

        grid.style.gridTemplateColumns = `2fr 1.5fr 1fr ${"1fr ".repeat(
          STATUS_EFFECTS.length
        )} 0.7fr`;

        headers.forEach((h) => {
          const div = document.createElement("div");
          div.className = "grid-header";
          div.textContent = h;
          grid.appendChild(div);
        });

        for (let i = 1; i <= playerCount; i++) {
          rebuildPlayerRow(i);
        }

        restorePlayerData(saved);
      }

      /* ------------------------------
     PLAYER ROW REBUILD
  ------------------------------ */
      function rebuildPlayerRow(id) {
        const existing = document.querySelectorAll(`.row-${id}`);
        existing.forEach((e) => e.remove());

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.name = `name${id}`;
        nameInput.placeholder = "Enter name";
        nameInput.className = "grid-item row-" + id;

        const roleSelect = createRoleDropdown(`role${id}`);
        roleSelect.className = "grid-item row-" + id;

        const isDead = document.createElement("input");
        isDead.type = "checkbox";
        isDead.name = `isDead${id}`;

        const rowElements = [
          wrap(nameInput, false, id),
          wrap(roleSelect, false, id),
          wrap(isDead, true, id),
        ];

        STATUS_EFFECTS.forEach((effect) => {
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.name = `status_${effect.replace(/\s+/g, "_").toLowerCase()}_${id}`;
          rowElements.push(wrap(cb, true, id));
        });

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.textContent = "X";
        removeBtn.className = "remove-btn";
        removeBtn.onclick = () => removePlayer(id);
        rowElements.push(wrap(removeBtn, true, id));

        rowElements.forEach((el) => grid.appendChild(el));
      }

      function wrap(el, center = false, id) {
        const div = document.createElement("div");
        div.className =
          (center ? "grid-item checkbox-center" : "grid-item") + " row-" + id;
        div.appendChild(el);
        return div;
      }

      /* ------------------------------
     ROLE DROPDOWN
  ------------------------------ */
      function createRoleDropdown(name) {
        const select = document.createElement("select");
        select.name = name;

        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = "Select role";
        select.appendChild(empty);

        ROLE_OPTIONS.forEach((role) => {
          const opt = document.createElement("option");
          opt.value = role.toLowerCase();
          opt.textContent = role;
          select.appendChild(opt);
        });

        return select;
      }

      /* ------------------------------
     PLAYER MANAGEMENT
  ------------------------------ */
      function addPlayer() {
        const saved = capturePlayerData();
        playerCount++;
        rebuildHeaders();
        restorePlayerData(saved);
      }

      function removePlayer(id) {
        const elements = document.querySelectorAll(`.row-${id}`);
        elements.forEach((e) => e.remove());
      }

      /* ------------------------------
     CLEAR BUTTON
  ------------------------------ */
      clearBtn.addEventListener("click", () => {
        const names = [...form.querySelectorAll('input[type="text"]')].map(
          (i) => i.value
        );
        form.reset();
        form.querySelectorAll('input[type="text"]').forEach((input, index) => {
          input.value = names[index] || "";
        });
      });

      /* ------------------------------
     PREVENT ENTER / SUBMIT RELOAD
  ------------------------------ */
      form.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
        }
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        // Hook your own save logic here if needed
        console.log("Save clicked - implement your save logic here.");

        window.location.href =
          location.origin +
          location.pathname +
          "?playerData=" +
          JSON.stringify(capturePlayerData()) +
          "&roleData=" +
          JSON.stringify(ROLE_OPTIONS) +
          "&statusData=" +
          JSON.stringify(STATUS_EFFECTS);
      });

      /* ------------------------------
     ROLE MANAGER
  ------------------------------ */
      function renderRoleList() {
        roleListDiv.innerHTML = "";

        ROLE_OPTIONS.forEach((role, index) => {
          const row = document.createElement("div");
          row.textContent = role;

          const removeBtn = document.createElement("button");
          removeBtn.textContent = "Remove";
          removeBtn.onclick = () => {
            ROLE_OPTIONS.splice(index, 1);
            renderRoleList();
            rebuildHeaders();
          };

          row.appendChild(removeBtn);
          roleListDiv.appendChild(row);
        });
      }

      addRoleBtn.addEventListener("click", () => {
        const newRole = newRoleInput.value.trim();
        if (newRole && !ROLE_OPTIONS.includes(newRole)) {
          ROLE_OPTIONS.push(newRole);
          newRoleInput.value = "";
          renderRoleList();
          rebuildHeaders();
        }
      });

      /* ------------------------------
     STATUS EFFECT MANAGER
  ------------------------------ */
      function renderStatusList() {
        statusListDiv.innerHTML = "";

        STATUS_EFFECTS.forEach((effect, index) => {
          const row = document.createElement("div");
          row.textContent = effect;

          const removeBtn = document.createElement("button");
          removeBtn.textContent = "Remove";
          removeBtn.onclick = () => {
            STATUS_EFFECTS.splice(index, 1);
            renderStatusList();
            rebuildHeaders();
          };

          row.appendChild(removeBtn);
          statusListDiv.appendChild(row);
        });
      }

      addStatusBtn.addEventListener("click", () => {
        const newEffect = newStatusInput.value.trim();
        if (newEffect && !STATUS_EFFECTS.includes(newEffect)) {
          STATUS_EFFECTS.push(newEffect);
          newStatusInput.value = "";
          renderStatusList();
          rebuildHeaders();
        }
      });

      /* ------------------------------
     INIT
  ------------------------------ */
      addPlayer();
      renderRoleList();
      renderStatusList();
      addBtn.addEventListener("click", addPlayer);
      restoreFromURL();
    </script>
  </body>
</html>
