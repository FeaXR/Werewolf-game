<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Werewolf</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>Werewolf</h1>
        <p class="subtitle">Moderator board</p>
      </div>
      <div class="summary" id="summary" aria-live="polite"></div>
    </header>

    <main>
      <div class="toolbar">
        <button
          type="button"
          class="btn primary"
          id="nextTurnBtn"
          title="Advance the turn and clear effects that last one turn"
        >
          Next turn →
        </button>
        <button type="button" class="btn" id="addPlayerBtn">
          + Add player
        </button>
        <button
          type="button"
          class="btn"
          id="hideRolesBtn"
          aria-pressed="false"
          title="Blur roles so nearby players can't peek"
        >
          Hide roles
        </button>
        <button
          type="button"
          class="btn"
          id="resetBtn"
          title="Clear roles, deaths and effects but keep player names"
        >
          New game
        </button>
        <button
          type="button"
          class="btn"
          id="shareBtn"
          title="Copy a link containing the whole game"
        >
          Copy share link
        </button>
        <span class="save-status" id="saveStatus">Saved</span>
      </div>

      <div class="tally" id="tally"></div>

      <ol class="players" id="playerList"></ol>
      <p class="empty" id="emptyState" hidden>
        No players yet. Press <strong>+ Add player</strong> to start.
      </p>

      <section class="settings">
        <details class="panel" id="roleManager">
          <summary>Roles <span class="count" id="roleCount"></span></summary>
          <form class="add-form" id="roleForm">
            <input
              type="text"
              id="newRoleInput"
              placeholder="New role name"
              aria-label="New role name"
              autocomplete="off"
            />
            <button type="submit" class="btn">Add</button>
          </form>
          <ul class="chip-list" id="roleList"></ul>
        </details>

        <details class="panel" id="statusManager">
          <summary>
            Status effects <span class="count" id="statusCount"></span>
          </summary>
          <form class="add-form" id="statusForm">
            <input
              type="text"
              id="newStatusInput"
              placeholder="New status effect"
              aria-label="New status effect"
              autocomplete="off"
            />
            <select
              id="newStatusDuration"
              class="duration-select"
              aria-label="How long the effect lasts"
            >
              <option value="turn">1 turn</option>
              <option value="game">Whole game</option>
            </select>
            <button type="submit" class="btn">Add</button>
          </form>
          <p class="hint">
            Effects with a dashed outline last one turn and are cleared by
            <strong>Next turn</strong>. Click an effect's duration to change
            it.
          </p>
          <ul class="chip-list" id="statusList"></ul>
        </details>
      </section>
    </main>

    <div class="toast" id="toast" role="status" hidden>
      <span id="toastText"></span>
      <button type="button" class="btn small" id="toastUndo" hidden>
        Undo
      </button>
    </div>

    <script>
      /* ------------------------------
     CENTRAL DATA
  ------------------------------ */
      const STORAGE_KEY = "werewolf-game";
      const PREFS_KEY = "werewolf-prefs";

      const DEFAULT_ROLES = [
        "Werewolf",
        "Villager",
        "Seer",
        "Bodyguard",
        "Chupakabra",
        "Vacuum salesman",
      ];
      // duration: "game" lasts until the game ends, "turn" is cleared by Next turn.
      const DEFAULT_EFFECTS = [
        { name: "Has Vacuum", duration: "game" },
        { name: "Infected", duration: "game" },
        { name: "Protected", duration: "turn" },
        { name: "Muted", duration: "turn" },
      ];

      // One object holds the whole game; everything is rendered from it.
      // state = { turn, roles, effects, players }
      // player = { name, role, dead, effects: [effect names] }
      let state = loadState();

      const $ = (id) => document.getElementById(id);
      const playerList = $("playerList");

      /* ------------------------------
     HELPERS
  ------------------------------ */
      function el(tag, props = {}, children = []) {
        const node = document.createElement(tag);
        Object.entries(props).forEach(([key, value]) => {
          if (key === "dataset") Object.assign(node.dataset, value);
          else if (key in node) node[key] = value;
          else node.setAttribute(key, value);
        });
        children.forEach((child) => child && node.append(child));
        return node;
      }

      function newPlayer(name = "") {
        return { name, role: "", dead: false, effects: [] };
      }

      function sameText(a, b) {
        return a.trim().toLowerCase() === b.trim().toLowerCase();
      }

      /* ------------------------------
     LOAD & SAVE
  ------------------------------ */
      function normalize(raw) {
        const roles = Array.isArray(raw?.roles)
          ? raw.roles.map(String)
          : [...DEFAULT_ROLES];
        const effects = Array.isArray(raw?.effects)
          ? raw.effects.map((e) => ({
              name: String(e?.name ?? ""),
              duration: e?.duration === "game" ? "game" : "turn",
            })).filter((e) => e.name)
          : DEFAULT_EFFECTS.map((e) => ({ ...e }));
        const effectNames = effects.map((e) => e.name);
        const players = Array.isArray(raw?.players)
          ? raw.players.map((p) => ({
              name: String(p?.name ?? ""),
              role: roles.includes(p?.role) ? p.role : "",
              dead: !!p?.dead,
              effects: Array.isArray(p?.effects)
                ? p.effects.filter((e) => effectNames.includes(e))
                : [],
            }))
          : [newPlayer()];
        const turn = Math.max(1, parseInt(raw?.turn, 10) || 1);
        return { turn, roles, effects, players };
      }

      function loadState() {
        const params = new URLSearchParams(location.search);
        try {
          if (params.has("game")) {
            const fromUrl = JSON.parse(params.get("game"));
            // Drop the params so a refresh doesn't overwrite later edits.
            history.replaceState(null, "", location.pathname);
            return normalize(fromUrl);
          }
        } catch (err) {
          console.warn("Could not read game from link", err);
        }

        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) return normalize(JSON.parse(stored));
        } catch (err) {
          console.warn("Could not read saved game", err);
        }

        return normalize(null);
      }

      let saveTimer;
      function save() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          $("saveStatus").textContent = "Saved";
        } catch {
          $("saveStatus").textContent = "Not saved (storage unavailable)";
        }
        $("saveStatus").classList.add("flash");
        clearTimeout(saveTimer);
        saveTimer = setTimeout(
          () => $("saveStatus").classList.remove("flash"),
          600
        );
      }

      function commit() {
        save();
        render();
      }

      /* ------------------------------
     UNDO TOAST
  ------------------------------ */
      let undoSnapshot = null;
      let toastTimer;

      function toast(message, undoable = false) {
        $("toastText").textContent = message;
        $("toastUndo").hidden = !undoable;
        $("toast").hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          $("toast").hidden = true;
          undoSnapshot = null;
        }, 5000);
      }

      function snapshot() {
        undoSnapshot = JSON.stringify(state);
      }

      $("toastUndo").addEventListener("click", () => {
        if (!undoSnapshot) return;
        state = JSON.parse(undoSnapshot);
        undoSnapshot = null;
        $("toast").hidden = true;
        commit();
      });

      /* ------------------------------
     RENDER
  ------------------------------ */
      function render() {
        renderSummary();
        renderPlayers();
        renderList("role", state.roles, $("roleList"), $("roleCount"));
        renderList("status", state.effects, $("statusList"), $("statusCount"));
      }

      function renderSummary() {
        const total = state.players.length;
        const dead = state.players.filter((p) => p.dead).length;
        $("summary").replaceChildren(
          el("span", { className: "stat turn" }, [
            "Turn ",
            el("strong", { textContent: state.turn }),
          ]),
          el("span", { className: "stat" }, [
            el("strong", { textContent: total }),
            ` player${total === 1 ? "" : "s"}`,
          ]),
          el("span", { className: "stat alive" }, [
            el("strong", { textContent: total - dead }),
            " alive",
          ]),
          el("span", { className: "stat dead" }, [
            el("strong", { textContent: dead }),
            " dead",
          ])
        );

        // Roles still in play among living players.
        const counts = new Map();
        state.players
          .filter((p) => !p.dead)
          .forEach((p) => {
            const role = p.role || "Unassigned";
            counts.set(role, (counts.get(role) || 0) + 1);
          });
        $("tally").replaceChildren(
          ...[...counts].map(([role, n]) =>
            el("span", {
              className:
                "tally-item" + (role === "Unassigned" ? " muted" : ""),
              textContent: `${role} × ${n}`,
            })
          )
        );
      }

      function renderPlayers() {
        $("emptyState").hidden = state.players.length > 0;

        playerList.replaceChildren(
          ...state.players.map((player, index) => {
            const roleSelect = el(
              "select",
              {
                className: "role",
                "aria-label": `Role for player ${index + 1}`,
              },
              [
                el("option", { value: "", textContent: "Select role" }),
                ...state.roles.map((role) =>
                  el("option", { value: role, textContent: role })
                ),
              ]
            );
            roleSelect.value = player.role;

            const effects = state.effects.map(({ name, duration }) =>
              el("button", {
                type: "button",
                className: `chip toggle lasts-${duration}`,
                textContent: name,
                title: duration === "turn" ? "Lasts one turn" : "Lasts the whole game",
                "aria-pressed": player.effects.includes(name),
                dataset: { action: "effect", effect: name },
              })
            );

            return el(
              "li",
              {
                className: "player" + (player.dead ? " is-dead" : ""),
                dataset: { index },
              },
              [
                el("span", {
                  className: "player-number",
                  textContent: index + 1,
                }),
                el("input", {
                  type: "text",
                  className: "name",
                  value: player.name,
                  placeholder: "Player name",
                  "aria-label": `Name of player ${index + 1}`,
                  autocomplete: "off",
                }),
                roleSelect,
                el("div", { className: "effects" }, effects),
                el("button", {
                  type: "button",
                  className: "btn life",
                  textContent: player.dead ? "Dead" : "Alive",
                  "aria-pressed": player.dead,
                  title: player.dead ? "Revive player" : "Mark as dead",
                  dataset: { action: "dead" },
                }),
                el("button", {
                  type: "button",
                  className: "btn icon remove",
                  textContent: "×",
                  title: "Remove player",
                  "aria-label": `Remove player ${index + 1}`,
                  dataset: { action: "remove" },
                }),
              ]
            );
          })
        );
      }

      function renderList(kind, items, listEl, countEl) {
        countEl.textContent = items.length;
        listEl.replaceChildren(
          ...items.map((entry, index) => {
            const item = kind === "role" ? entry : entry.name;
            return el("li", { className: "chip" }, [
              item,
              kind === "status" &&
                el("button", {
                  type: "button",
                  className: `chip-duration lasts-${entry.duration}`,
                  textContent: entry.duration === "turn" ? "1 turn" : "game",
                  title: `${item} lasts ${
                    entry.duration === "turn" ? "one turn" : "the whole game"
                  }. Click to change.`,
                  dataset: { index },
                }),
              el("button", {
                type: "button",
                className: "chip-remove",
                textContent: "×",
                title: `Remove ${item}`,
                "aria-label": `Remove ${item}`,
                dataset: { kind, index },
              }),
            ]);
          })
        );
      }

      /* ------------------------------
     PLAYER MANAGEMENT
  ------------------------------ */
      function addPlayer({ focus = true } = {}) {
        state.players.push(newPlayer());
        commit();
        if (focus) focusName(state.players.length - 1);
      }

      function focusName(index) {
        playerList
          .querySelector(`li[data-index="${index}"] .name`)
          ?.focus();
      }

      function playerIndex(target) {
        return Number(target.closest("li.player")?.dataset.index);
      }

      // Typing updates the data without re-rendering so focus is kept.
      playerList.addEventListener("input", (e) => {
        if (!e.target.matches(".name")) return;
        state.players[playerIndex(e.target)].name = e.target.value;
        save();
      });

      playerList.addEventListener("change", (e) => {
        if (!e.target.matches(".role")) return;
        state.players[playerIndex(e.target)].role = e.target.value;
        save();
        renderSummary();
      });

      // Enter in a name field jumps to the next player (or adds one).
      playerList.addEventListener("keydown", (e) => {
        if (e.key !== "Enter" || !e.target.matches(".name")) return;
        e.preventDefault();
        const index = playerIndex(e.target);
        if (index === state.players.length - 1) addPlayer();
        else focusName(index + 1);
      });

      playerList.addEventListener("click", (e) => {
        const button = e.target.closest("button[data-action]");
        if (!button) return;
        const index = playerIndex(button);
        const player = state.players[index];

        switch (button.dataset.action) {
          case "dead":
            player.dead = !player.dead;
            break;
          case "effect": {
            const effect = button.dataset.effect;
            player.effects = player.effects.includes(effect)
              ? player.effects.filter((x) => x !== effect)
              : [...player.effects, effect];
            break;
          }
          case "remove":
            snapshot();
            state.players.splice(index, 1);
            toast(`Removed ${player.name || `player ${index + 1}`}`, true);
            break;
        }
        commit();
      });

      $("addPlayerBtn").addEventListener("click", () => addPlayer());

      /* ------------------------------
     TOOLBAR
  ------------------------------ */
      $("nextTurnBtn").addEventListener("click", () => {
        snapshot();
        const turnOnly = state.effects
          .filter((e) => e.duration === "turn")
          .map((e) => e.name);
        let cleared = 0;
        state.players.forEach((p) => {
          const kept = p.effects.filter((name) => !turnOnly.includes(name));
          cleared += p.effects.length - kept.length;
          p.effects = kept;
        });
        state.turn++;
        commit();
        toast(
          `Turn ${state.turn}` +
            (cleared ? `: cleared ${cleared} one-turn effect${cleared === 1 ? "" : "s"}` : ""),
          true
        );
      });

      $("resetBtn").addEventListener("click", () => {
        snapshot();
        state.players = state.players.map((p) => newPlayer(p.name));
        state.turn = 1;
        commit();
        toast("New game: roles, deaths and effects cleared", true);
      });

      $("shareBtn").addEventListener("click", async () => {
        const url =
          location.origin +
          location.pathname +
          "?game=" +
          encodeURIComponent(JSON.stringify(state));
        try {
          await navigator.clipboard.writeText(url);
          toast("Share link copied to clipboard");
        } catch {
          window.prompt("Copy this link:", url);
        }
      });

      function setRolesHidden(hidden) {
        document.body.classList.toggle("roles-hidden", hidden);
        $("hideRolesBtn").setAttribute("aria-pressed", hidden);
        $("hideRolesBtn").textContent = hidden ? "Show roles" : "Hide roles";
        try {
          localStorage.setItem(PREFS_KEY, JSON.stringify({ hidden }));
        } catch {}
      }

      $("hideRolesBtn").addEventListener("click", () =>
        setRolesHidden(!document.body.classList.contains("roles-hidden"))
      );

      /* ------------------------------
     ROLE & STATUS EFFECT MANAGERS
  ------------------------------ */
      // Roles are plain strings; effects are { name, duration } objects.
      function setupManager(kind, form, input, listEl, durationSelect) {
        const items = () => (kind === "role" ? state.roles : state.effects);
        const nameOf = (item) => (kind === "role" ? item : item.name);

        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const value = input.value.trim();
          if (!value) return;
          if (items().some((x) => sameText(nameOf(x), value))) {
            toast(`"${value}" already exists`);
            input.select();
            return;
          }
          items().push(
            kind === "role"
              ? value
              : { name: value, duration: durationSelect.value }
          );
          input.value = "";
          commit();
        });

        listEl.addEventListener("click", (e) => {
          const toggle = e.target.closest(".chip-duration");
          if (toggle) {
            const effect = items()[Number(toggle.dataset.index)];
            effect.duration = effect.duration === "turn" ? "game" : "turn";
            commit();
            return;
          }

          const button = e.target.closest(".chip-remove");
          if (!button) return;
          const index = Number(button.dataset.index);
          const removed = nameOf(items()[index]);

          snapshot();
          items().splice(index, 1);
          // Clear the removed role/effect from any player using it.
          state.players.forEach((p) => {
            if (kind === "role" && p.role === removed) p.role = "";
            if (kind === "status")
              p.effects = p.effects.filter((x) => x !== removed);
          });
          commit();
          toast(`Removed "${removed}"`, true);
        });
      }

      setupManager("role", $("roleForm"), $("newRoleInput"), $("roleList"));
      setupManager(
        "status",
        $("statusForm"),
        $("newStatusInput"),
        $("statusList"),
        $("newStatusDuration")
      );

      /* ------------------------------
     INIT
  ------------------------------ */
      try {
        setRolesHidden(!!JSON.parse(localStorage.getItem(PREFS_KEY))?.hidden);
      } catch {
        setRolesHidden(false);
      }
      save();
      render();
    </script>
  </body>
</html>
